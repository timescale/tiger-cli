    MetricsSeriesRequest:
      x-tigerdata-preview: true
      type: object
      additionalProperties: false
      description: |
        Parameters for a single getServiceMetricsSeries query. Sent as a JSON
        body so callers can pass an unbounded filter set without query-string
        length pressure.
      required:
        - name
        - from
        - to
      properties:
        name:
          type: string
          description: Metric series name. Use getServiceMetricsAvailableSeries to discover valid values.
          example: "timescale_cloud_system_cpu_usage_millicores"
        from:
          type: string
          format: date-time
          description: Start of the time window (RFC3339; nanosecond precision accepted).
          example: "2026-06-25T10:00:00Z"
        to:
          type: string
          format: date-time
          description: End of the time window (RFC3339; nanosecond precision accepted).
          example: "2026-06-25T11:00:00Z"
        bucket_seconds:
          type: integer
          minimum: 60
          description: |
            Aggregation bucket size in seconds. Optional: when omitted the
            server picks a default that matches the window (roughly 1m for
            windows up to 1h, 1h for up to 30d, 1d beyond that). Minimum is
            60s (finer buckets don't add resolution given scrape intervals).
            Must be coarse enough for the window's tier; requests that ask
            for a finer bucket than the tier can produce are rejected.
          example: 3600
        fn:
          type: string
          enum:
            - RATE
            - INCREASE
            - SUM
            - AVG
            - MIN
            - MAX
            - COUNT
            - P50
            - P90
            - P99
            - LAST
          description: |
            Aggregation function applied to raw/pre-aggregated samples when
            collapsing them into one value per output bucket. Optional: when
            omitted the server picks the default for the metric (currently
            `LAST`).

            Not accepted on the following metrics — requests are rejected
            with `INVALID_REQUEST`:
              - `timescale_cloud_system_cpu_total_millicores`
              - `timescale_cloud_system_cpu_usage_millicores`
              - `timescale_cloud_system_disk_io_read_bytes`
              - `timescale_cloud_system_disk_io_read_ops`
              - `timescale_cloud_system_disk_io_total_bytes`
              - `timescale_cloud_system_disk_io_total_ops`
              - `timescale_cloud_system_disk_io_write_bytes`
              - `timescale_cloud_system_disk_io_write_ops`
              - `timescale_cloud_system_disk_usage_bytes`
              - `timescale_cloud_system_memory_total_bytes`
              - `timescale_cloud_system_memory_usage_bytes`
              - `timescale_cloud_database_qps`
              - `timescale_cloud_database_num_connections`
              - `timescale_cloud_database_job_duration_usecs`
              - `timescale_cloud_database_job_success`

            Values:
              - `RATE`: counter-reset-aware per-second rate of change.
              - `INCREASE`: counter-reset-aware total increase over the bucket.
              - `SUM`: sum of samples in the bucket.
              - `AVG`: mean of samples in the bucket.
              - `MIN`: minimum sample in the bucket.
              - `MAX`: maximum sample in the bucket.
              - `COUNT`: number of samples in the bucket.
              - `P50` / `P90` / `P99`: percentile approximations (only valid
                for metrics stored as sketches).
              - `LAST`: the most recent sample in the bucket (default).
          example: "RATE"
        filters:
          type: array
          description: |
            Label filters applied to the series query. Recognized label names
            depend on the metric. The most common is `role` (value `primary` or
            `replica`). When `role` is omitted, some metrics default to primary
            and others return data for all roles (one series per role); pass an
            explicit role for deterministic results. Role label values in the
            response are lowercased.
          items:
            $ref: '#/components/schemas/MetricLabelFilter'

    MetricLabelFilter:
      x-tigerdata-preview: true
      type: object
      description: A single key/value label match applied to a metric series query.
      required:
        - key
        - value
      properties:
        key:
          type: string
          minLength: 1
          description: Label key to match against, e.g. `role` or `job_id`.
          example: "role"
        value:
          type: string
          minLength: 1
          description: Label value to match. Case sensitivity follows the underlying metric's storage convention.
          example: "primary"

    MetricSeries:
      x-tigerdata-preview: true
      type: object
      description: One labeled time series — the label set plus its per-bucket data points.
      required:
        - labels
        - data
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            Label set identifying this series. The key set depends on the
            metric (e.g. `role`, `ordinal`).
        data:
          type: array
          description: Per-bucket data points for this label set.
          items:
            $ref: '#/components/schemas/MetricDataPoint'

    MetricDataPoint:
      x-tigerdata-preview: true
      type: object
      description: A single time/value pair within a MetricSeries.
      required:
        - time
      properties:
        time:
          type: string
          format: date-time
          description: The bucket start timestamp.
          example: "2026-06-25T10:00:00Z"
        value:
          type: number
          format: double
          nullable: true
          x-omitempty: false
          description: |
            The aggregated value at this bucket, or null for a gap bucket with
            no collected data. Gap buckets are still emitted (one entry per
            bucket in the window), so this is null rather than omitted.
          example: 247.5

