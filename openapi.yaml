openapi: 3.0.3
info:
  title: Tiger Cloud API
  description: |
    A RESTful API for Tiger Cloud platform.

    Operations and schemas annotated with `x-tigerdata-preview: true` are experimental —
    their shape may change without notice and they are excluded from
    auto-generated SDKs. Stable entries have no `x-tigerdata-preview` marker. Schemas
    used only by preview operations should be tagged so the SDK doesn't
    inherit orphan model classes; schemas shared with stable operations stay
    unmarked.
  version: 1.0.0
  license:
    name: Proprietary
    url: https://www.tigerdata.com/legal/terms
  contact:
    name: Tiger Data Support
    url: https://www.tigerdata.com/contact
servers:
  - url: https://console.cloud.tigerdata.com/public/api/v1
    description: API server for Tiger Cloud.

tags:
  - name: Auth
    description: Authentication and authorization information.
  - name: Projects
    description: Manage the projects that organize your Tiger Cloud resources.
  - name: VPCs
    description: Manage VPCs and their peering connections.
  - name: Services
    description: Manage services and their associated actions.
  - name: Read Replica Sets
    description: Manage read replica sets and their associated actions.
  - name: Backups
    description: View the backups taken for a service.
  - name: Analytics
    description: Track analytics events.

paths:
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Log out and revoke refresh token
      description: |
        Revokes the caller's refresh token server-side. For OAuth Bearer
        callers, include the refresh token in the request body — it is held
        client-side and cannot be derived from the access token. Callers
        without a refresh token to revoke may post an
        empty body to clear server-side session state best-effort.

        Returns 204 No Content on success. The caller is still responsible
        for dropping any locally-cached credentials.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The OAuth refresh token to revoke. Omit for sessions without a refresh token.
      responses:
        '204':
          description: Logout successful.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /auth/info:
    get:
      operationId: getAuthInfo
      tags:
        - Auth
      summary: Get Authentication Info
      description: |
        Returns the authenticated caller's identity. The response shape depends on the credential type: `apiKey` for PAT
        callers, `oauth` for OAuth user callers. Exactly one of `api_key` or `oauth` is populated;
        `type` discriminates.
      responses:
        '200':
          description: Authentication information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthInfo'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /analytics/identify:
    post:
      operationId: identifyUser
      tags:
        - Analytics
      summary: Identify a user
      description: Identifies a user with optional properties for analytics tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  type: object
                  additionalProperties: true
                  description: Optional map of arbitrary properties associated with the user.
                  example:
                    email: "user@example.com"
                    name: "John Doe"
      responses:
        '200':
          $ref: '#/components/responses/AnalyticsResponse'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /analytics/track:
    post:
      operationId: trackEvent
      tags:
        - Analytics
      summary: Track an analytics event
      description: Tracks an analytics event with optional properties.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
              properties:
                event:
                  type: string
                  description: The name of the event to track.
                  example: service_created
                properties:
                  type: object
                  additionalProperties: true
                  description: Optional map of arbitrary properties associated with the event.
                  example:
                    region: "us-east-1"
      responses:
        '200':
          $ref: '#/components/responses/AnalyticsResponse'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects:
    get:
      operationId: getProjects
      tags:
        - Projects
      summary: List projects accessible to the authenticated caller
      description: |
        Returns the projects the caller can access. PAT callers see only the
        project their PAT is scoped to; OAuth user callers see all projects
        they belong to.
      responses:
        '200':
          description: List of accessible projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/vpcs:
    get:
      operationId: getVPCs
      tags:
        - VPCs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      summary: List All VPCs
      description: Retrieves a list of all Virtual Private Clouds (VPCs).
      responses:
        '200':
          description: A list of VPCs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VPC'
        '4XX':
          $ref: '#/components/responses/ClientError'
    post:
      operationId: createVPC
      tags:
        - VPCs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      summary: Create a VPC
      description: Creates a new Virtual Private Cloud (VPC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VPCCreate'
      responses:
        '201':
          description: VPC created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPC'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/vpcs/{vpc_id}:
    get:
      operationId: getVPC
      tags:
        - VPCs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
      summary: Get a VPC
      description: Retrieves the details of a specific VPC by its ID.
      responses:
        '200':
          description: VPC details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPC'
        '4XX':
          $ref: '#/components/responses/ClientError'
    delete:
      operationId: deleteVPC
      tags:
        - VPCs
      summary: Delete a VPC
      description: Deletes a specific VPC.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
      responses:
        '204':
          description: VPC deleted successfully.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/vpcs/{vpc_id}/rename:
    post:
      operationId: renameVPC
      tags:
        - VPCs
      summary: Rename a VPC
      description: Updates the name of a specific VPC.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VPCRename'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/vpcs/{vpc_id}/peerings:
    get:
      operationId: getVPCPeerings
      tags:
        - VPCs
      summary: List VPC Peerings
      description: Retrieves a list of all VPC peering connections for a given VPC.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
      responses:
        '200':
          description: A list of VPC peering connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Peering'
        '4XX':
          $ref: '#/components/responses/ClientError'
    post:
      operationId: createVPCPeering
      tags:
        - VPCs
      summary: Create a VPC Peering
      description: Creates a new VPC peering connection.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeeringCreate'
      responses:
        '201':
          description: VPC peering created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peering'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/vpcs/{vpc_id}/peerings/{peering_id}:
    get:
      operationId: getVPCPeering
      tags:
        - VPCs
      summary: Get a VPC Peering
      description: Retrieves the details of a specific VPC peering connection.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
        - $ref: '#/components/parameters/PeeringId'
      responses:
        '200':
          description: VPC peering details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peering'
        '4XX':
          $ref: '#/components/responses/ClientError'
    delete:
      operationId: deleteVPCPeering
      tags:
        - VPCs
      summary: Delete a VPC Peering
      description: Deletes a specific VPC peering connection.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
        - $ref: '#/components/parameters/PeeringId'
      responses:
        '204':
          description: VPC peering deleted successfully.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services:
    get:
      operationId: getServices
      tags:
        - Services
      summary: List All Services
      description: Retrieves a list of all services within a specific project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: A list of services.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'
    post:
      operationId: createService
      tags:
        - Services
      summary: Create a Service
      description: Creates a new database service within a project. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '202':
          description: Service creation request has been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}:
    get:
      operationId: getService
      tags:
        - Services
      summary: Get a Service
      description: Retrieves the details of a specific service by its ID.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Service details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'
    delete:
      operationId: deleteService
      tags:
        - Services
      summary: Delete a Service
      description: Deletes a specific service. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '202':
          description: Deletion request has been accepted.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/start:
    post:
      operationId: startService
      tags:
        - Services
      summary: Start a Service
      description: Starts a stopped service within a project. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '202':
          description: Service start request has been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/stop:
    post:
      operationId: stopService
      tags:
        - Services
      summary: Stop a Service
      description: Stops a running service within a project. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '202':
          description: Service stop request has been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/rename:
    post:
      operationId: renameService
      tags:
        - Services
      summary: Rename a Service
      description: Updates the name of a specific service.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRename'
      responses:
        '200':
          description: Service renamed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/attachToVPC:
    post:
      operationId: attachServiceToVPC
      tags:
        - Services
      summary: Attach Service to VPC
      description: Associates a service with a VPC.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceVPCInput'
      responses:
        '202':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/detachFromVPC:
    post:
      operationId: detachServiceFromVPC
      tags:
        - Services
      summary: Detach Service from VPC
      description: Disassociates a service from its VPC.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceVPCInput'
      responses:
        '202':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/resize:
    post:
      operationId: resizeService
      tags:
        - Services
      summary: Resize a Service
      description: Changes the CPU and memory allocation for a specific service within a project. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeInput'
      responses:
        '202':
          description: Resize request has been accepted and is in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/enablePooler:
    post:
      operationId: enablePooler
      tags:
        - Services
      summary: Enable Connection Pooler for a Service
      description: Activates the connection pooler for a specific service within a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/disablePooler:
    post:
      operationId: disablePooler
      tags:
        - Services
      summary: Disable Connection Pooler for a Service
      description: Deactivates the connection pooler for a specific service within a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/forkService:
    post:
      operationId: forkService
      tags:
        - Services
      summary: Fork a Service
      description: Creates a new, independent service within a project by taking a snapshot of an existing one.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkServiceCreate'
      responses:
        '202':
          description: Fork request accepted. The response contains the details of the new service being created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/updatePassword:
    post:
      operationId: updatePassword
      tags:
        - Services
      summary: Update Service Password
      description: Sets a new master password for the service within a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordInput'
      responses:
        '204':
          description: Password updated successfully. No content returned.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/setEnvironment:
    post:
      operationId: setEnvironment
      tags:
        - Services
      summary: Set Environment for a Service
      description: Sets the environment type for the service.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnvironmentInput'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/logs:
    get:
      operationId: getServiceLogs
      tags:
        - Services
      summary: Get service logs
      description: |
        Fetch logs for a specific service. Returns up to 500 log entries in reverse
        chronological order. Supports cursor-based pagination via the `cursor` parameter
        and the `last_cursor` field in the response.

        Use the returned `last_cursor` value as the `cursor` parameter on subsequent
        requests to page through all available logs.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
        - name: node
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Specific service node to fetch logs from (for multi-node services).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            Opaque pagination cursor returned as `last_cursor` in a previous response.
            When provided, returns the next page of logs older than the cursor position.
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Upper bound timestamp — fetch logs before this time (RFC3339 format, e.g., 2024-01-15T10:00:00Z).
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            Lower bound timestamp — fetch logs after this time (RFC3339 format).
        - name: search
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              minLength: 1
              pattern: "\\S"
          style: form
          explode: true
          description: |
            Full-text search terms to filter log lines. Repeat the parameter for multiple values
            (e.g. `?search=slow+query&search=ERROR`).
        - name: severities
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              minLength: 1
              pattern: "\\S"
          style: form
          explode: true
          description: |
            Severity levels to filter results. Repeat the parameter for multiple values
            (e.g. `?severities=ERROR&severities=WARNING`).
      responses:
        '200':
          description: Service logs retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceLogs'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/backups:
    get:
      operationId: getBackups
      x-tigerdata-preview: true
      tags:
        - Backups
      summary: List All Backups
      description: |
        **Preview - this endpoint is experimental and may change without notice.**

        Retrieves a list of the full and incremental backups taken for a
        service. Backups run automatically on a schedule; there is no operation
        to create or delete one. To restore data, create a recovery fork with
        `fork_strategy: PITR`.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: A list of backups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Backup'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/metrics/available-series:
    get:
      operationId: getServiceMetricsAvailableSeries
      x-tigerdata-preview: true
      tags:
        - Services
      summary: List available metric series
      description: |
        **Preview — this endpoint is experimental and may change without notice.**

        Returns the names of all metric series available for a service.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Available metric series names.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/metrics/series:
    post:
      operationId: getServiceMetricsSeries
      x-tigerdata-preview: true
      tags:
        - Services
      summary: Get a metric series
      description: |
        **Preview — this endpoint is experimental and may change without notice.**

        Returns time-series data points for a named metric within a time window.
        Use getServiceMetricsAvailableSeries to discover valid metric names.

        Parameters are sent as a JSON body so callers can pass an unbounded
        filter set without query-string length pressure. The response is a list
        of MetricSeries, each carrying its label set as a structured map
        alongside its per-bucket data points.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsSeriesRequest'
      responses:
        '200':
          description: Metric series matching the request.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricSeries'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/setHA:
    post:
      operationId: setHAReplica
      tags:
        - Services
      summary: Change HA configuration for a Service
      description: Changes the HA configuration for a specific service. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetHAReplicaInput'
      responses:
        '202':
          description: HA replica configuration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/replicaSets:
    get:
      operationId: getReplicaSets
      tags:
        - Read Replica Sets
      summary: Get Read Replica Sets
      description: Retrieves a list of all read replica sets associated with a primary service within a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: A list of read replica sets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadReplicaSet'
        '4XX':
          $ref: '#/components/responses/ClientError'
    post:
      operationId: createReplicaSet
      tags:
        - Read Replica Sets
      summary: Create a Read Replica Set
      description: Creates a new read replica set for a service. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadReplicaSetCreate'
      responses:
        '202':
          description: Read replica set creation request has been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadReplicaSet'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/replicaSets/{replica_set_id}:
    delete:
      operationId: deleteReplicaSet
      tags:
        - Read Replica Sets
      summary: Delete a Read Replica Set
      description: Deletes a specific read replica set. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ReplicaSetId'
      responses:
        '202':
          description: Deletion request has been accepted.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/replicaSets/{replica_set_id}/resize:
    post:
      operationId: resizeReplicaSet
      tags:
        - Read Replica Sets
      summary: Resize a Read Replica Set
      description: Changes the resource allocation for a specific read replica set.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ReplicaSetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeInput'
      responses:
        '202':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/replicaSets/{replica_set_id}/enablePooler:
    post:
      operationId: enableReplicaPooler
      tags:
        - Read Replica Sets
      summary: Enable Connection Pooler for a Read Replica
      description: Activates the connection pooler for a specific read replica set.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ReplicaSetId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/replicaSets/{replica_set_id}/disablePooler:
    post:
      operationId: disableReplicaPooler
      tags:
        - Read Replica Sets
      summary: Disable Connection Pooler for a Read Replica
      description: Deactivates the connection pooler for a specific read replica set.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ReplicaSetId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/replicaSets/{replica_set_id}/setEnvironment:
    post:
      operationId: setReplicaEnvironment
      tags:
        - Read Replica Sets
      summary: Set Environment for a Read Replica
      description: Sets the environment type for the read replica set.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ReplicaSetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnvironmentInput'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: The unique identifier of the project.
      schema:
        type: string
        example: "rp1pz7uyae"
    ServiceId:
      name: service_id
      in: path
      required: true
      description: The unique identifier of the service.
      schema:
        type: string
        example: "d1k5vk7hf2"
    ReplicaSetId:
      name: replica_set_id
      in: path
      required: true
      description: The unique identifier of the read replica set.
      schema:
        type: string
        minLength: 3
        example: "alb8jicdpr"
    VPCId:
      name: vpc_id
      in: path
      required: true
      description: The unique identifier of the VPC.
      schema:
        type: string
        pattern: "^[0-9]+$"
        example: "1234567890"
    PeeringId:
      name: peering_id
      in: path
      required: true
      description: The unique identifier of the VPC peering connection.
      schema:
        type: string
        pattern: "^[0-9]+$"
        example: "1234567890"

  schemas:
    AuthInfo:
      type: object
      description: |
        Information about the authentication credentials being used. Exactly one
        of `api_key` or `oauth` is populated; the `type` field discriminates.
      required:
        - type
      properties:
        type:
          type: string
          description: |
            Discriminator for the credential shape. `apiKey` for PAT callers; `oauth` for OAuth
            user callers.
          enum: ["apiKey", "oauth"]
          example: "apiKey"
        api_key:
          $ref: '#/components/schemas/AuthInfoApiKey'
        apiKey:
          deprecated: true
          x-deprecated-reason: Use `api_key` instead.
          x-go-name: ApiKeyDeprecated
          description: Deprecated. Use `api_key` instead.
          allOf:
            - $ref: '#/components/schemas/AuthInfoApiKey'
        oauth:
          $ref: '#/components/schemas/AuthInfoOAuth'
    AuthInfoApiKey:
      type: object
      description: Information about the API key credentials (PAT).
      required:
        - public_key
        - name
        - created
        - project
        - issuing_user
      properties:
        public_key:
          type: string
          description: The public key of the client credentials.
          example: "tskey_abc123"
        name:
          type: string
          description: The name of the credential.
          example: "my-production-token"
        created:
          type: string
          format: date-time
          description: When the client credentials were created.
          example: "2024-01-15T10:30:00Z"
        project:
          $ref: '#/components/schemas/AuthInfoProject'
        issuing_user:
          $ref: '#/components/schemas/AuthInfoIssuingUser'
    AuthInfoProject:
      type: object
      description: Information about the project.
      required:
        - id
        - name
        - plan_type
      properties:
        id:
          type: string
          description: The project ID.
          example: "rp1pz7uyae"
        name:
          type: string
          description: The name of the project.
          example: "My Production Project"
        plan_type:
          type: string
          description: The plan type for the project.
          example: "FREE"
    AuthInfoIssuingUser:
      type: object
      description: Information about the user who created the credentials.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          description: The user ID.
          example: "user123"
        name:
          type: string
          description: The user's name.
          example: "John Doe"
        email:
          type: string
          format: email
          description: The user's email.
          example: "john.doe@example.com"
    AuthInfoOAuth:
      type: object
      description: OAuth user details. Present for OAuth user callers.
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/AuthInfoUser'
    AuthInfoUser:
      type: object
      description: The authenticated OAuth user.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          description: The numeric user ID.
          example: "1234567"
        name:
          type: string
          description: The user's name.
          example: "John Doe"
        email:
          type: string
          format: email
          description: The user's email.
          example: "john.doe@example.com"
    VPC:
      type: object
      description: A virtual private cloud that services can be attached to.
      required:
        - id
        - name
        - cidr
        - region_code
      properties:
        id:
          type: string
          readOnly: true
          description: The unique identifier for the VPC.
          example: "1234567890"
        name:
          type: string
          description: The name of the VPC.
          example: "my-production-vpc"
        cidr:
          type: string
          format: cidr
          description: The IPv4 CIDR block for the VPC, in address/prefix notation (e.g. 10.0.0.0/16).
          example: "10.0.0.0/16"
        region_code:
          type: string
          description: The cloud region where the VPC is hosted.
          example: "us-east-1"
    VPCCreate:
      type: object
      description: Parameters for creating a VPC.
      required:
        - name
        - cidr
        - region_code
      properties:
        name:
          type: string
          description: The name of the VPC.
          example: "my-production-vpc"
        cidr:
          type: string
          format: cidr
          description: The IPv4 CIDR block for the VPC, in address/prefix notation (e.g. 10.0.0.0/16).
          example: "10.0.0.0/16"
        region_code:
          type: string
          description: The cloud region where the VPC will be created.
          example: "us-east-1"
    ServiceRename:
      type: object
      description: Parameters for renaming a service.
      required:
        - name
      properties:
        name:
          type: string
          description: The new name for the service.
          example: "my-renamed-service"
    VPCRename:
      type: object
      description: Parameters for renaming a VPC.
      required:
        - name
      properties:
        name:
          type: string
          description: The new name for the VPC.
          example: "my-renamed-vpc"
    Peering:
      type: object
      description: A VPC peering connection to an external cloud account.
      required:
        - id
        - peer_account_id
        - peer_region_code
        - peer_vpc_id
      properties:
        id:
          type: string
          readOnly: true
          description: The unique identifier for the peering connection.
          example: "1234567890"
        peer_account_id:
          type: string
          description: The cloud account ID of the peer VPC.
          example: "acc-12345"
        peer_region_code:
          type: string
          description: The cloud region of the peer VPC.
          example: "us-east-1"
        peer_vpc_id:
          type: string
          description: The ID of the peer VPC.
          example: "1234567890"
        provisioned_id:
          type: string
          description: The provider-assigned identifier for the provisioned peering.
          example: "1234567890"
        status:
          type: string
          description: The current status of the peering connection.
          example: "active"
        error_message:
          type: string
          description: A human-readable error message when the peering connection failed.
          example: "VPC not found"
    PeeringCreate:
      type: object
      description: Parameters for creating a VPC peering connection.
      required:
        - peer_account_id
        - peer_region_code
        - peer_vpc_id
      properties:
        peer_account_id:
          type: string
          description: The cloud account ID of the peer VPC.
          example: "acc-12345"
        peer_region_code:
          type: string
          description: The cloud region of the peer VPC.
          example: "us-east-1"
        peer_vpc_id:
          type: string
          description: The ID of the peer VPC.
          example: "1234567890"
    Endpoint:
      type: object
      description: A network endpoint for connecting to a service.
      properties:
        host:
          type: string
          description: The hostname of the endpoint.
          example: "i4wmp4crev.oec7sxsza2.tsdb.cloud.timescale.com"
        port:
          type: integer
          description: The port of the endpoint.
          example: 32625
    VPCEndpoint:
      type: object
      description: VPC endpoint configuration for connecting to a service over VPC peering.
      properties:
        host:
          type: string
          description: The hostname for connecting to the service over VPC peering.
          example: "i4wmp4crev.oec7sxsza2.tsdb.cloud.timescale.com"
        port:
          type: integer
          description: The port for connecting to the service over VPC peering.
          example: 5432
        vpc_id:
          type: string
          description: The ID of the VPC the endpoint is associated with.
          example: "1337"
    ConnectionPooler:
      type: object
      description: Connection pooler configuration for a service.
      properties:
        endpoint:
          $ref: '#/components/schemas/Endpoint'
    Service:
      type: object
      description: A database service and its current configuration.
      required:
        - service_id
        - project_id
        - name
        - region_code
        - service_type
        - created
        - status
        - resources
      properties:
        service_id:
          type: string
          description: The unique identifier for the service.
          example: "kd9w2xp4mz"
        project_id:
          type: string
          description: The project this service belongs to.
          example: "rp1pz7uyae"
        name:
          type: string
          description: The name of the service.
          example: "my-production-db"
        region_code:
          type: string
          description: The cloud region where the service is hosted.
          example: "us-east-1"
        service_type:
          allOf:
            - $ref: '#/components/schemas/ServiceType'
          description: The type of the service.
        created:
          type: string
          format: date-time
          description: Creation timestamp.
          example: "2025-01-15T09:30:00Z"
        initial_password:
          type: string
          description: The initial password for the service.
          format: password
          example: "a-very-secure-initial-password"
        status:
          allOf:
            - $ref: '#/components/schemas/DeployStatus'
          description: Current status of the service.
        resources:
          type: array
          description: List of resources allocated to the service.
          items:
            $ref: '#/components/schemas/Resource'
        metrics:
          $ref: '#/components/schemas/ServiceMetrics'
        metadata:
          $ref: '#/components/schemas/ServiceMetadata'
        endpoint:
          $ref: '#/components/schemas/Endpoint'
        vpc_endpoint:
          description: VPC endpoint configuration if available.
          allOf:
            - $ref: '#/components/schemas/VPCEndpoint'
        vpcEndpoint:
          deprecated: true
          x-deprecated-reason: Use `vpc_endpoint` instead.
          x-go-name: VpcEndpointDeprecated
          description: Deprecated. Use `vpc_endpoint` instead.
          allOf:
            - $ref: '#/components/schemas/VPCEndpoint'
        forked_from:
          $ref: '#/components/schemas/ForkSpec'
        ha_replicas:
          $ref: '#/components/schemas/HAReplica'
        connection_pooler:
          $ref: '#/components/schemas/ConnectionPooler'
        read_replica_sets:
          type: array
          description: The read replica sets attached to the service.
          items:
            $ref: '#/components/schemas/ReadReplicaSet'
    Resource:
      type: object
      description: A resource allocated to the service.
      properties:
        id:
          type: string
          description: Resource identifier.
          example: "n4ph2tqz8r"
        spec:
          $ref: '#/components/schemas/ResourceSpec'
    ResourceSpec:
      type: object
      description: Resource specification.
      properties:
        cpu_millis:
          type: integer
          description: CPU allocation in millicores.
          example: 1000
        memory_gbs:
          type: integer
          description: Memory allocation in gigabytes.
          example: 4
        volume_type:
          type: string
          description: Type of storage volume.
          example: "gp3"
    ServiceMetadata:
      type: object
      description: Additional metadata for the service.
      properties:
        environment:
          type: string
          description: Environment tag for the service.
          example: "PROD"
    ServiceType:
      type: string
      description: |
        The type of the service:
        - TIMESCALEDB: a TimescaleDB service (PostgreSQL with the TimescaleDB extension)
        - POSTGRES: a standard PostgreSQL service

        VECTOR is deprecated and should not be used.
      enum:
      - TIMESCALEDB
      - POSTGRES
      - VECTOR
    EnvironmentTag:
        type: string
        enum:
        - DEV
        - PROD
        description: |
          The environment tag for the service:
          - DEV: a development environment
          - PROD: a production environment
    ForkStrategy:
      type: string
      enum:
      - LAST_SNAPSHOT
      - NOW
      - PITR
      description: |
        Strategy for creating the fork:
        - LAST_SNAPSHOT: Use existing snapshot for fast fork
        - NOW: Create new snapshot for up-to-date fork
        - PITR: Point-in-time recovery using target_time
    DeployStatus:
      type: string
      description: |
        The current deployment status of the service:
        - QUEUED: the create request has been submitted and is queued
        - DELETING: the service is being deleted
        - CONFIGURING: the service is up but still completing configuration
        - READY: fully configured and serving traffic
        - DELETED: the service has been deleted
        - UNSTABLE: the service was ready but is not currently reachable
        - PAUSING: the service is being paused
        - PAUSED: the service is paused (temporarily shut down)
        - RESUMING: the service is resuming after being paused
        - UPGRADING: the service is being updated

        OPTIMIZING is deprecated and should not be used.
      enum:
      - QUEUED
      - DELETING
      - CONFIGURING
      - READY
      - DELETED
      - UNSTABLE
      - PAUSING
      - PAUSED
      - RESUMING
      - UPGRADING
      - OPTIMIZING
    ForkSpec:
      type: object
      description: The service this service was forked from.
      properties:
        project_id:
          type: string
          description: The project of the parent service.
          example: "rp1pz7uyae"
        service_id:
          type: string
          description: The ID of the parent service.
          example: "kd9w2xp4mz"
        is_standby:
          type: boolean
          description: Whether this service is a standby of the parent service.
          example: false
    ReadReplicaSet:
      type: object
      description: A set of read replicas for a service.
      required:
        - id
        - name
        - status
        - nodes
        - cpu_millis
        - memory_gbs
      properties:
        id:
          type: string
          description: The unique identifier for the read replica set.
          example: "alb8jicdpr"
        name:
          type: string
          description: The name of the read replica set.
          example: "reporting-replica-1"
        status:
          type: string
          description: |
            The current status of the read replica set:
            - creating: the replica set is being provisioned
            - active: the replica set is provisioned and serving traffic
            - resizing: the replica set is being resized
            - deleting: the replica set is being deleted
            - error: the replica set is in an error state
          enum: [creating, active, resizing, deleting, error]
          example: "active"
        nodes:
          type: integer
          description: Number of nodes in the replica set.
          example: 2
        cpu_millis:
          type: integer
          description: CPU allocation in milli-cores.
          example: 250
        memory_gbs:
          type: integer
          description: Memory allocation in gigabytes.
          example: 1
        metadata:
          $ref: '#/components/schemas/ReplicaSetMetadata'
        endpoint:
          $ref: '#/components/schemas/Endpoint'
        connection_pooler:
          $ref: '#/components/schemas/ConnectionPooler'
    ReplicaSetMetadata:
      type: object
      description: Additional metadata for the read replica set.
      properties:
        environment:
          type: string
          description: Environment tag for the read replica set.
          example: "PROD"
    ServiceCreate:
      type: object
      description: Parameters for creating a service.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: A human-readable name for the service.
          example: "my-production-db"
        addons:
          type: array
          items:
            type: string
            enum: ["time-series", "ai"]
          description: List of addons to enable for the service. 'time-series' enables TimescaleDB, 'ai' enables AI/vector extensions.
          example: ["time-series", "ai"]
        region_code:
          type: string
          description: The region where the service will be created. If not provided, we'll choose the best region for you.
          example: "us-east-1"
        replica_count:
          type: integer
          minimum: 0
          description: Number of high-availability replicas to create (all replicas are asynchronous by default).
          example: 2
        cpu_millis:
          type: string
          description: The initial CPU allocation in milli-cores, or 'shared' for a shared-resource service.
          example: "1000"
        memory_gbs:
          type: string
          description: The initial memory allocation in gigabytes, or 'shared' for a shared-resource service.
          example: "4"
        environment_tag:
          allOf:
            - $ref: '#/components/schemas/EnvironmentTag'
          description: The environment tag for the service.
          default: DEV
    ForkServiceCreate:
      type: object
      required:
        - fork_strategy
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: A human-readable name for the forked service. If not provided, will use parent service name with "-fork" suffix.
          example: "my-production-db-fork"
        cpu_millis:
          type: string
          description: The initial CPU allocation in milli-cores, or 'shared' for a shared-resource service. If not provided, will inherit from parent service.
          example: "1000"
        memory_gbs:
          type: string
          description: The initial memory allocation in gigabytes, or 'shared' for a shared-resource service. If not provided, will inherit from parent service.
          example: "4"
        fork_strategy:
          $ref: '#/components/schemas/ForkStrategy'
        target_time:
          type: string
          format: date-time
          description: Target time for point-in-time recovery. Required when fork_strategy is PITR.
          example: "2024-01-01T00:00:00Z"
        environment_tag:
          allOf:
            - $ref: '#/components/schemas/EnvironmentTag'
          description: The environment tag for the forked service.
          default: DEV
      description: |
        Create a fork of an existing service. Service type, region code, and storage are always inherited from the parent service.
        HA replica count is always set to 0 for forked services.
    HAReplica:
      type: object
      description: High-availability replica configuration for a service.
      properties:
        sync_replica_count:
          type: integer
          description: Number of synchronous high-availability replicas.
          example: 1
        replica_count:
          type: integer
          description: Number of high-availability replicas (all replicas are asynchronous by default).
          example: 1
    ServiceMetrics:
      type: object
      nullable: true
      description: Resource usage metrics for the service.
      properties:
        memory_mb:
          type: integer
          nullable: true
          description: Memory usage in megabytes.
          example: 512
        storage_mb:
          type: integer
          nullable: true
          description: Storage usage in megabytes.
          example: 1024
        milli_cpu:
          type: integer
          nullable: true
          description: CPU usage in millicores.
          example: 250
    SetHAReplicaInput:
      type: object
      properties:
        sync_replica_count:
          type: integer
          minimum: 0
          description: Number of synchronous high-availability replicas.
          example: 1
        replica_count:
          type: integer
          minimum: 0
          description: Number of high-availability replicas (all replicas are asynchronous by default).
          example: 1
      description: At least one of sync_replica_count or replica_count must be provided.
    ReadReplicaSetCreate:
      type: object
      description: Parameters for creating a read replica set.
      required:
        - name
        - nodes
        - cpu_millis
        - memory_gbs
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: A human-readable name for the read replica.
          example: "my-reporting-replica"
        nodes:
          type: integer
          minimum: 1
          description: Number of nodes to create in the replica set.
          example: 2
        cpu_millis:
          type: integer
          minimum: 1
          description: The initial CPU allocation in milli-cores.
          example: 250
        memory_gbs:
          type: integer
          minimum: 1
          description: The initial memory allocation in gigabytes.
          example: 1
    ResizeInput:
      type: object
      description: Parameters for resizing a service.
      required:
        - cpu_millis
        - memory_gbs
      properties:
        cpu_millis:
          type: string
          pattern: "^[0-9]+$"
          description: The new CPU allocation in milli-cores.
          example: "1000"
        memory_gbs:
          type: string
          pattern: "^[0-9]+$"
          description: The new memory allocation in gigabytes.
          example: "4"
    UpdatePasswordInput:
      type: object
      description: Parameters for updating a service's password.
      required:
        - password
      properties:
        password:
          type: string
          description: The new password.
          format: password
          example: "a-very-secure-new-password"
    SetEnvironmentInput:
      type: object
      description: Parameters for setting a service's environment.
      required:
        - environment
      properties:
        environment:
