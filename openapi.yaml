openapi: 3.0.3
info:
  title: Tiger Cloud API
  description: |
    A RESTful API for Tiger Cloud platform.

    Operations and schemas annotated with `x-tigerdata-preview: true` are experimental —
    their shape may change without notice and they are excluded from
    auto-generated SDKs. Stable entries have no `x-tigerdata-preview` marker. Schemas
    used only by preview operations should be tagged so the SDK doesn't
    inherit orphan model classes; schemas shared with stable operations stay
    unmarked.

    Operations and schemas annotated with `x-tigerdata-internal: true` are for
    first-party clients only (e.g. Tiger CLI) and are excluded from public docs
    and SDKs, same as preview entries.
  version: 1.0.0
  license:
    name: Proprietary
    url: https://www.tigerdata.com/legal/terms
  contact:
    name: Tiger Data Support
    url: https://www.tigerdata.com/contact
servers:
  - url: https://console.cloud.tigerdata.com/public/api/v1
    description: API server for Tiger Cloud.

tags:
  - name: Auth
    description: Authentication and authorization information.
  - name: Projects
    description: Manage the projects that organize your Tiger Cloud resources.
  - name: VPCs
    description: Manage VPCs and their peering connections.
  - name: Services
    description: Manage services and their associated actions.
  - name: Read Replica Sets
    description: Manage read replica sets and their associated actions.
  - name: Backups
    description: View the backups taken for a service.
  - name: Exporters
    description: Send service logs and metrics to an external monitoring system.
  - name: IP Allow Lists
    description: Restrict which IP ranges can reach your services.
  - name: Analytics
    description: Track analytics events.
  - name: Feedback
    description: Send feedback, bug reports, and support requests to Tiger Data.

paths:
  /auth/logout:
    post:
      operationId: logout
      x-tigerdata-owner: bizx
      tags:
        - Auth
      summary: Log out and revoke refresh token
      description: |
        Revokes the caller's refresh token server-side. For OAuth Bearer
        callers, include the refresh token in the request body — it is held
        client-side and cannot be derived from the access token. Callers
        without a refresh token to revoke may post an
        empty body to clear server-side session state best-effort.

        Returns 204 No Content on success. The caller is still responsible
        for dropping any locally-cached credentials.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The OAuth refresh token to revoke. Omit for sessions without a refresh token.
      responses:
        '204':
          description: Logout successful.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /auth/info:
    get:
      operationId: getAuthInfo
      x-tigerdata-owner: bizx
      tags:
        - Auth
      summary: Get Authentication Info
      description: |
        Returns the authenticated caller's identity. The response shape depends on the credential type: `apiKey` for PAT
        callers, `oauth` for OAuth user callers. Exactly one of `api_key` or `oauth` is populated;
        `type` discriminates.
      responses:
        '200':
          description: Authentication information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthInfo'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /analytics/identify:
    post:
      operationId: identifyUser
      x-tigerdata-owner: unknown
      x-tigerdata-internal: true
      tags:
        - Analytics
      summary: Identify a user
      description: Identifies a user with optional properties for analytics tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  type: object
                  additionalProperties: true
                  description: Optional map of arbitrary properties associated with the user.
                  example:
                    email: "user@example.com"
                    name: "John Doe"
      responses:
        '200':
          $ref: '#/components/responses/AnalyticsResponse'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /analytics/track:
    post:
      operationId: trackEvent
      x-tigerdata-owner: unknown
      x-tigerdata-internal: true
      tags:
        - Analytics
      summary: Track an analytics event
      description: Tracks an analytics event with optional properties.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
              properties:
                event:
                  type: string
                  description: The name of the event to track.
                  example: service_created
                properties:
                  type: object
                  additionalProperties: true
                  description: Optional map of arbitrary properties associated with the event.
                  example:
                    region: "us-east-1"
      responses:
        '200':
          $ref: '#/components/responses/AnalyticsResponse'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /feedback:
    post:
      operationId: submitFeedback
      x-tigerdata-owner: prodexp
      x-tigerdata-internal: true
      tags:
        - Feedback
      summary: Submit feedback
      description: |
        Sends feedback, a bug report, or a support request to Tiger Data.

        The submitter's email address is resolved from the caller's
        credentials, and the client version and operating system from the
        `User-Agent` header, so neither is supplied in the body.

        Returns 204 No Content on success. This endpoint opens no support
        case and returns no ticket to track: use it for unsolicited feedback,
        and raise anything needing a tracked response through support.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: The feedback, bug report, or support request to send.
                  minLength: 1
                  maxLength: 3000
                  pattern: "\\S"
                  example: "I can't connect to my service after resuming it."
                source:
                  type: string
                  description: >-
                    The client surface the feedback came from: `CLI` for a
                    command run by a person, `MCP` for a call made by an AI
                    assistant. Omit it from other clients; the `User-Agent`
                    header still identifies them.
                  enum:
                    - CLI
                    - MCP
                  example: "CLI"
      responses:
        '204':
          description: Feedback submitted.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects:
    get:
      operationId: getProjects
      x-tigerdata-owner: bizx
      tags:
        - Projects
      summary: List projects accessible to the authenticated caller
      description: |
        Returns the projects the caller can access. PAT callers see only the
        project their PAT is scoped to; OAuth user callers see all projects
        they belong to.
      responses:
        '200':
          description: List of accessible projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/vpcs:
    get:
      operationId: getVPCs
      x-tigerdata-owner: platform
      tags:
        - VPCs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      summary: List All VPCs
      description: Retrieves a list of all Virtual Private Clouds (VPCs).
      responses:
        '200':
          description: A list of VPCs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VPC'
        '4XX':
          $ref: '#/components/responses/ClientError'
    post:
      operationId: createVPC
      x-tigerdata-owner: platform
      tags:
        - VPCs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      summary: Create a VPC
      description: Creates a new Virtual Private Cloud (VPC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VPCCreate'
      responses:
        '201':
          description: VPC created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPC'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/vpcs/{vpc_id}:
    get:
      operationId: getVPC
      x-tigerdata-owner: platform
      tags:
        - VPCs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
      summary: Get a VPC
      description: Retrieves the details of a specific VPC by its ID.
      responses:
        '200':
          description: VPC details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPC'
        '4XX':
          $ref: '#/components/responses/ClientError'
    delete:
      operationId: deleteVPC
      x-tigerdata-owner: platform
      tags:
        - VPCs
      summary: Delete a VPC
      description: Deletes a specific VPC.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
      responses:
        '204':
          description: VPC deleted successfully.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/vpcs/{vpc_id}/rename:
    post:
      operationId: renameVPC
      x-tigerdata-owner: platform
      tags:
        - VPCs
      summary: Rename a VPC
      description: Updates the name of a specific VPC.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VPCRename'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/vpcs/{vpc_id}/peerings:
    get:
      operationId: getVPCPeerings
      x-tigerdata-owner: platform
      tags:
        - VPCs
      summary: List VPC Peerings
      description: Retrieves a list of all VPC peering connections for a given VPC.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
      responses:
        '200':
          description: A list of VPC peering connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Peering'
        '4XX':
          $ref: '#/components/responses/ClientError'
    post:
      operationId: createVPCPeering
      x-tigerdata-owner: platform
      tags:
        - VPCs
      summary: Create a VPC Peering
      description: Creates a new VPC peering connection.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeeringCreate'
      responses:
        '201':
          description: VPC peering created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peering'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/vpcs/{vpc_id}/peerings/{peering_id}:
    get:
      operationId: getVPCPeering
      x-tigerdata-owner: platform
      tags:
        - VPCs
      summary: Get a VPC Peering
      description: Retrieves the details of a specific VPC peering connection.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
        - $ref: '#/components/parameters/PeeringId'
      responses:
        '200':
          description: VPC peering details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peering'
        '4XX':
          $ref: '#/components/responses/ClientError'
    delete:
      operationId: deleteVPCPeering
      x-tigerdata-owner: platform
      tags:
        - VPCs
      summary: Delete a VPC Peering
      description: Deletes a specific VPC peering connection.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/VPCId'
        - $ref: '#/components/parameters/PeeringId'
      responses:
        '204':
          description: VPC peering deleted successfully.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services:
    get:
      operationId: getServices
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: List All Services
      description: Retrieves a list of all services within a specific project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: A list of services.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'
    post:
      operationId: createService
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Create a Service
      description: Creates a new database service within a project. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '202':
          description: Service creation request has been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/resolve:
    post:
      operationId: resolveServiceRef
      x-tigerdata-owner: prodexp
      x-tigerdata-internal: true
      tags:
        - Services
      summary: Resolve a Service Reference
      description: |
        Resolves a reference to a single service. The reference matches a
        service whose ID equals it, or whose name equals it — exactly and
        case-sensitively, with no precedence between the two. Read replica
        sets match on either, like any other service. A reference matching
        more than one service is refused rather than resolved.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRefRequest'
      responses:
        '200':
          description: The resolved service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}:
    get:
      operationId: getService
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Get a Service
      description: Retrieves the details of a specific service by its ID.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Service details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'
    delete:
      operationId: deleteService
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Delete a Service
      description: Deletes a specific service. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '202':
          description: Deletion request has been accepted.
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/start:
    post:
      operationId: startService
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Start a Service
      description: Starts a stopped service within a project. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '202':
          description: Service start request has been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/stop:
    post:
      operationId: stopService
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Stop a Service
      description: Stops a running service within a project. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '202':
          description: Service stop request has been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/rename:
    post:
      operationId: renameService
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Rename a Service
      description: Updates the name of a specific service.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRename'
      responses:
        '200':
          description: Service renamed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/attachToVPC:
    post:
      operationId: attachServiceToVPC
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Attach Service to VPC
      description: Associates a service with a VPC.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceVPCInput'
      responses:
        '202':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/detachFromVPC:
    post:
      operationId: detachServiceFromVPC
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Detach Service from VPC
      description: Disassociates a service from its VPC.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceVPCInput'
      responses:
        '202':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/attachToExporter:
    post:
      operationId: attachServiceToExporter
      x-tigerdata-owner: platform
      x-tigerdata-preview: true
      tags:
        - Services
      summary: Attach Service to Exporter
      description: |
        **Preview - this endpoint is experimental and may change without notice.**

        Starts sending a service's logs or metrics to an exporter.

        A service sends to at most one log exporter and one metric exporter at
        a time. Attaching a second exporter of the same kind is refused;
        detach the current one first.

        The first time a log exporter is attached to a service, the service
        restarts once. Attaching a different log exporter later does not
        restart anything, and neither does attaching a metric exporter.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceExporterInput'
      responses:
        '202':
          description: |
            The attachment was accepted. The service is returned with the
            exporter recorded on it. Data starts flowing shortly after.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/detachFromExporter:
    post:
      operationId: detachServiceFromExporter
      x-tigerdata-owner: platform
      x-tigerdata-preview: true
      tags:
        - Services
      summary: Detach Service from Exporter
      description: |
        **Preview - this endpoint is experimental and may change without notice.**

        Stops sending a service's logs or metrics to an exporter. The exporter
        is not deleted and keeps serving any other service attached to it.

        Data already delivered to the destination is untouched.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceExporterInput'
      responses:
        '202':
          description: |
            The detachment was accepted. The service is returned with the
            exporter cleared. Delivery stops shortly after.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/attachToAllowList:
    post:
      operationId: attachServiceToAllowList
      x-tigerdata-owner: platform
      x-tigerdata-preview: true
      tags:
        - Services
      summary: Attach Service to IP Allow List
      description: |
        **Preview - this endpoint is experimental and may change without notice.**

        Restricts a service's connections to the IP ranges in an IP allow list.
        A service has at most one IP allow list; attaching a second one
        without detaching the first is refused.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAllowListInput'
      responses:
        '202':
          description: The attachment was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/detachFromAllowList:
    post:
      operationId: detachServiceFromAllowList
      x-tigerdata-owner: platform
      x-tigerdata-preview: true
      tags:
        - Services
      summary: Detach Service from IP Allow List
      description: |
        **Preview - this endpoint is experimental and may change without notice.**

        Removes the IP restriction an IP allow list placed on a service. The
        IP allow list itself is not deleted.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAllowListInput'
      responses:
        '202':
          description: The detachment was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/resize:
    post:
      operationId: resizeService
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Resize a Service
      description: Changes the CPU and memory allocation for a specific service within a project. This is an asynchronous operation.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeInput'
      responses:
        '202':
          description: Resize request has been accepted and is in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/enablePooler:
    post:
      operationId: enablePooler
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Enable Connection Pooler for a Service
      description: Activates the connection pooler for a specific service within a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/disablePooler:
    post:
      operationId: disablePooler
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Disable Connection Pooler for a Service
      description: Deactivates the connection pooler for a specific service within a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '4XX':
          $ref: '#/components/responses/ClientError'

  /projects/{project_id}/services/{service_id}/enableDataTiering:
    post:
      operationId: enableDataTiering
      x-tigerdata-owner: platform
      tags:
        - Services
      summary: Enable Data Tiering for a Service
      description: |
        Enables tiered storage on the service. Tiering policies move older,
        rarely-accessed data from the high-performance storage tier to a
        low-cost object storage tier. Tiered data stays queryable but becomes
        read-only.

        There is no way to disable tiering through this API. Contact Tiger
        Data support if you need to turn it off.
      parameters:
