    Backup:
      x-tigerdata-preview: true
      type: object
      description: A single backup of a service, taken automatically by Tiger Cloud.
      required:
        - label
        - type
        - started_at
        - regions
      properties:
        label:
          type: string
          description: The label the backup system assigns to this backup.
          example: "20260115-093000F"
        type:
          allOf:
            - $ref: '#/components/schemas/BackupType'
          description: The type of the backup.
        started_at:
          type: string
          format: date-time
          description: When the backup started.
          example: "2026-01-15T09:30:00Z"
        finished_at:
          type: string
          format: date-time
          description: When the backup finished. Absent while the backup is still running.
          example: "2026-01-15T09:41:12Z"
        duration_seconds:
          type: integer
          format: int64
          minimum: 0
          description: How long the backup took, in seconds. Absent while the backup is still running.
          example: 672
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: The size of the backup in bytes. Absent while the backup is still running.
          example: 4831838208
        regions:
          type: array
