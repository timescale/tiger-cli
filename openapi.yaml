          schema:
            type: object
            properties:
              status:
                type: string
                description: Status of the analytics operation.
                example: "success"
    SuccessMessage:
      description: The action was completed successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Action completed successfully."
    ClientError:
      description: Client error response (4xx status codes).
      content:
        application/json:
          schema:
