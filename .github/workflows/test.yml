name: Test

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: # still allow manual triggering

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          check-latest: true
          cache: true

      - name: Install keyring dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11

      - name: Start D-Bus and keyring
        run: |
          # Start D-Bus session
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV

          # Initialize gnome-keyring with a test password
          echo 'test' | gnome-keyring-daemon --unlock
          eval $(echo 'test' | gnome-keyring-daemon --start --components=secrets)
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> $GITHUB_ENV

      - name: ShellCheck
        run: shellcheck scripts/install.sh

      - name: Mod
        run: go mod tidy --diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Fix
        run: go fix -diff ./...

      - name: Staticcheck
        run: go tool staticcheck ./...

      - name: Test
        env:
          TIGER_PUBLIC_KEY_INTEGRATION: ${{ secrets.TIGER_PUBLIC_KEY_INTEGRATION }}
          TIGER_SECRET_KEY_INTEGRATION: ${{ secrets.TIGER_SECRET_KEY_INTEGRATION }}
          # Runs the live-CDN upgrade test (TestUpgradeLiveCDNIntegration)
          TIGER_UPGRADE_INTEGRATION: "1"
        run: go test -race -timeout 15m -coverprofile=coverage.out -coverpkg=./... ./...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o=coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage.html
          path: coverage.html
